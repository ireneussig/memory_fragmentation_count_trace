[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ireneussig-memory_fragmentation_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出训练资源调度工程师·显存碎片与分配策略上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ireneussig" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ireneussig.github.io"
Repository = "https://github.com/ireneussig/memory_fragmentation_count_trace"
Issues = "https://github.com/ireneussig/memory_fragmentation_count_trace/issues"

[project.scripts]
memory_fragmentation_count_trace = "memory_fragmentation_count_trace:main"

[tool.setuptools]
py-modules = ["memory_fragmentation_count_trace"]
